# DRAFT fdroiddata/metadata/org.ayuless.messenger.yml; not a submission or a tested build.
# Resolve CHECKLIST.md before enabling: asset provenance, embedded QuickJS
# builtins, full classpath/scanner and build-server validation remain open.
Categories:
  - Internet
License: GPL-3.0-or-later
AuthorName: Ayuless contributors
SourceCode: https://github.com/SU4G3/Ayuless
IssueTracker: https://github.com/SU4G3/Ayuless/issues

AutoName: Ayuless

RepoType: git
Repo: https://github.com/SU4G3/Ayuless.git

# Localized store descriptions and artwork come from fastlane/metadata/android/.
# Telegram's server software is proprietary. Open-source map clients do not
# change the classification of the required Telegram service.
AntiFeatures:
  NonFreeNet:
    en-US: Requires Telegram's proprietary servers and a Telegram account. Optional payments and embedded web services also contact third parties.
    ru-RU: Требует аккаунт Telegram и его несвободные серверы. Платежи и встроенные веб-сервисы также обращаются к третьим лицам.
  Ads:
    en-US: Telegram sponsored messages can be shown when the local hiding setting is disabled.
    ru-RU: Спонсорские сообщения Telegram могут показываться при отключённом локальном скрытии.

Builds:
  - versionName: 13.2.1
    # gradle.properties APP_VERSION_CODE=7291; afat adds ABI digit 9.
    versionCode: 72919
    disable: 'Draft: asset provenance, QuickJS builtin sources, scanner and build validation; see CHECKLIST.md'
    commit: REPLACE_WITH_REVIEWED_RELEASE_COMMIT
    subdir: TMessagesProj_App
    submodules: true
    # fdroiddata rustup srclib supplies the reviewed installer; no curl|sh here.
    # Verify this srclib/version against the target fdroiddata checkout.
    srclibs:
      - rustup@1.28.2
    sudo:
      - apt-get update
      - apt-get install -y build-essential cmake ninja-build make nasm meson pkg-config gperf python3 perl patch clang nodejs npm
      - npm install --global pnpm@12.10.1
    gradle:
      - afat
    gradleprops:
      - ayulessUnsignedRelease=true
      - ayulessRebuildWidgetJs=true
    # WidgetJS .qbc and unused WASM have been removed from the repository.
    # Do not scanignore executable bytecode, including QuickJS builtin arrays.
    rm:
      - TMessagesProj/config/release.keystore
      - TMessagesProj/jni/twidget/widget-sandbox/apps/android/gradle/wrapper/gradle-wrapper.jar
      - TMessagesProj/jni/twidget/widget-sandbox/packages/android/gradle/wrapper/gradle-wrapper.jar
    prebuild:
      - (cd .. && cp API_KEYS.example API_KEYS)
      - (cd .. && python3 Tools/check_degoogle.py)
      # Networked preparation on the F-Droid server, before source scanning.
      # The sandbox used to edit this recipe has not executed these commands.
      - $$rustup$$/rustup-init.sh -y --no-modify-path --profile minimal --default-toolchain 1.96.1
      - . $HOME/.cargo/env && rustup set auto-self-update disable
      - . $HOME/.cargo/env && rustup toolchain install 1.98.0 --profile minimal
      - . $HOME/.cargo/env && rustup target add --toolchain 1.96.1 aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - . $HOME/.cargo/env && rustup target add --toolchain 1.98.0 aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - (cd .. && . $HOME/.cargo/env && Tools/native/vendor-rust.sh)
      - (cd ../TMessagesProj/jni/twidget/widget-sandbox && pnpm install --frozen-lockfile --ignore-scripts)
      # AGP requires the SDK CMake package, not only distro cmake.
      - $$SDK$$/cmdline-tools/latest/bin/sdkmanager 'cmake;3.22.1'
    # Executed from subdir after source scanning. The same source-build wrapper
    # as CI is used, with fetching explicitly disabled. All four ABIs are needed.
    # SDK 36/build-tools 36.0.0 are selected by Gradle. Cargo vendoring above
    # includes gram-wallet, the separate C++ generator workspace, and tlottie.
    # npm's esbuild host binary and source completeness need scanner review.
    build:
      - (cd .. && . $HOME/.cargo/env && export ANDROID_SDK_ROOT=$$SDK$$ ANDROID_NDK_HOME=$$NDK$$ SOURCE_DATE_EPOCH=1 TZ=UTC LC_ALL=C && Tools/native/build-prebuilts.sh --offline)
      - (cd .. && Tools/native/check-prebuilts.sh)
    ndk: 27.2.12479018
    # Gradle assembles afatRelease. With the property above, no signing key is
    # needed; F-Droid signs the result. Conventional output before F-Droid's
    # artifact handling: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
    # (the module explicitly overrides outputFileName to app.apk).

# Tags are checked, but automatic build creation stays off until review. The
# existing v0.1.0-alpha.1 tag does not match APP_VERSION_NAME=13.2.1, so do not
# invent a Version v%v tag template. Select a release-tag naming scheme first.
AutoUpdateMode: None
UpdateCheckMode: Tags
UpdateCheckData: 'gradle.properties|APP_VERSION_CODE=(\d+)|.|APP_VERSION_NAME=(.+)'
VercodeOperation:
  - '%c * 10 + 9'
CurrentVersion: 13.2.1
CurrentVersionCode: 72919
