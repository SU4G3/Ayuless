// Ayuless: Load private API credentials from the ignored root file, with CI environment overrides.
def apiKeys = new Properties()
def apiKeysFile = rootProject.file('API_KEYS')
if (apiKeysFile.exists()) {
    apiKeysFile.withInputStream { apiKeys.load(it) }
}
def appId = (System.getenv('APP_ID') ?: apiKeys.getProperty('APP_ID'))?.trim()
def appHash = (System.getenv('APP_HASH') ?: apiKeys.getProperty('APP_HASH'))?.trim()
def certFingerprint = (System.getenv('CERT_FINGERPRINT') ?: apiKeys.getProperty('CERT_FINGERPRINT'))?.trim() ?: ''
if (!appId || !appHash) {
    throw new GradleException('Missing APP_ID or APP_HASH. Copy API_KEYS.example to API_KEYS at the repository root and fill in your credentials, or set APP_ID and APP_HASH environment variables.')
}
// Ayuless: Normalize APP_ID to a decimal Java int literal and keep credentials out of errors.
def appIdValue
try {
    appIdValue = Integer.parseInt(appId)
    if (appIdValue <= 0) {
        throw new NumberFormatException()
    }
} catch (NumberFormatException ignored) {
    throw new GradleException('APP_ID must be a positive 32-bit integer in API_KEYS or the APP_ID environment variable.')
}

android {
    // Ayuless: SDK-specific implementations are replaced by org.ayuless fallbacks.
    sourceSets.main.java {
        exclude 'org/telegram/messenger/GoogleMapsProvider.java'
        exclude 'org/telegram/messenger/GoogleLocationProvider.java'
        exclude 'org/telegram/messenger/FirebasePhoneNumberVerificationHelper.java'
        exclude 'org/telegram/messenger/GcmPushListenerService.java'
        exclude 'org/telegram/messenger/WearAuthListenerService.java'
        exclude 'org/telegram/messenger/chromecast/ChromecastOptionsProvider.java'
    }

    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    ndkVersion "27.2.12479018"


    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        // Ayuless: Generate credentials in the library's org.telegram.messenger.BuildConfig.
        buildConfigField "int", "APP_ID", appIdValue.toString()
        buildConfigField "String", "APP_HASH", groovy.json.JsonOutput.toJson(appHash)
        buildConfigField "String", "CERT_FINGERPRINT", groovy.json.JsonOutput.toJson(certFingerprint)
        minSdkVersion 23
        targetSdkVersion 36

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        multiDexEnabled true

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-23' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
            shrinkResources false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "0"
        }

        HA_private {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "1"
        }

        HA_public {
            matchingFallbacks = ['release']
