def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        return props[propName]
    } else {
        return "";
    }
}
// Ayuless: removed proprietary Google/Play integration.

task checkVisibility {
    doFirst {
        def isPrivateBuild = project.gradle.startParameter.taskNames.find {
            it.contains("HA_private") || it.contains("HA_hardcore") || it.contains("Debug") || it.contains("Release")
        }
        def isPublicAllowed = !project.hasProperty("IS_PRIVATE") || !project.property("IS_PRIVATE").toBoolean()
        if (!isPrivateBuild && !isPublicAllowed) {
            throw new GradleException("Building public version of private code!")
        }
    }
    doLast {
        if (project.gradle.startParameter.taskNames.find { it.contains("HA_public") }) {
            def privateBuild = file("${projectDir}_AppHockeyApp/afat/HA_private/Telegram-Beta.apk")
            if (privateBuild.exists()) {
                privateBuild.delete()
            }
        }
    }
}

preBuild.dependsOn checkVisibility

// Ayuless: build packaged QuickJS bytecode from the same sources as the JNI engine.
// Generated assets are outside src/; stale committed binaries cannot be packaged.
def widgetAssets = layout.buildDirectory.dir('generated/widgetjs/assets')
def rebuildWidgetJs = providers.gradleProperty('ayulessRebuildWidgetJs').getOrElse('false').toBoolean()
def buildWidgetJs = tasks.register('buildWidgetJs', Exec) {
    inputs.property('rebuildFromTypeScript', rebuildWidgetJs)
    inputs.property('sourceDateEpoch', System.getenv('SOURCE_DATE_EPOCH') ?: '1')
    inputs.file(rootProject.file('Tools/native/build-widgetjs.sh'))
    inputs.dir(file('jni/twidget/widget-sandbox/packages/ios/Sources/CQuickJS'))
    inputs.dir(file('jni/twidget/widget-sandbox/packages/tools/qjsc'))
    inputs.files(fileTree('jni/twidget/widget-sandbox/packages/ios/Sources/WidgetSandbox/WidgetJS') { include '*.js' })
    if (rebuildWidgetJs) {
        inputs.dir(file('jni/twidget/widget-sandbox/packages/core/src'))
        inputs.dir(file('jni/twidget/widget-sandbox/packages/core/scripts'))
        inputs.file(file('jni/twidget/widget-sandbox/packages/core/profile.json'))
        inputs.file(file('jni/twidget/widget-sandbox/pnpm-lock.yaml'))
        inputs.file(file('jni/twidget/widget-sandbox/VERSION.json'))
    }
    outputs.dir(widgetAssets)
    workingDir rootProject.projectDir
    commandLine(['bash', rootProject.file('Tools/native/build-widgetjs.sh')] +
            (rebuildWidgetJs ? ['--rebundle'] : []) + [widgetAssets.get().asFile])
}
android.sourceSets.main.assets.srcDir(widgetAssets)
tasks.named('preBuild').configure { dependsOn(buildWidgetJs) }
