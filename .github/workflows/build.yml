# SPDX-License-Identifier: GPL-3.0-or-later
name: Build

on:
  push:
    branches: [main]
    paths: &build-paths
      - 'TMessagesProj*/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'gradlew*'
      - '*.gradle*'
      - 'gradle.properties'
      - 'API_KEYS.example'
      - '.gitmodules'
      - 'Tools/native/**'
      - 'Tools/test_noto_emoji.py'
      - '.github/actions/native-prebuilts/**'
  pull_request:
    branches: [main]
    paths: *build-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/2* /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      # Runner image ships the Android SDK; android-actions/setup-android@v3 fails on the removed 'tools' package.
      - name: Install SDK and NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"'

      - name: Check regenerated QuickJS builtins
        run: bash Tools/native/check-quickjs-builtins.sh

      - name: Install emoji validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      # Build native libraries from pinned source submodules (cached by input hash).
      # No native archives are stored in Git. See Tools/native/.
      - name: Native libraries from source
        uses: ./.github/actions/native-prebuilts

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Write API_KEYS
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          # CERT_FINGERPRINT is intentionally not passed: BuildVars defaults to the
          # official Telegram Android cert, which api_id 4 requires (see #53/login).
          if [ -n "$APP_ID" ]; then
            printf 'APP_ID=%s\nAPP_HASH=%s\n' "$APP_ID" "$APP_HASH" > API_KEYS
          else
            cp API_KEYS.example API_KEYS
          fi

      - name: Assemble afat release
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Validate packaged Noto emoji
        run: python3 Tools/test_noto_emoji.py TMessagesProj_App/build/outputs/apk/afat/release/app.apk

      - name: Describe the test artifact
        run: |
          echo '## CI test APK' >> "$GITHUB_STEP_SUMMARY"
          echo 'Uses the repository test signing key. Official releases are signed separately with the private release key.' >> "$GITHUB_STEP_SUMMARY"
          sha256sum TMessagesProj_App/build/outputs/apk/afat/release/app.apk >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ayuless-apk
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          if-no-files-found: error
          retention-days: 14
