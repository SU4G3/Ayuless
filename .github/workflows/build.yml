# SPDX-License-Identifier: GPL-3.0-or-later
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/2* /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Write API_KEYS
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          if [ -n "$APP_ID" ]; then
            printf 'APP_ID=%s\nAPP_HASH=%s\n' "$APP_ID" "$APP_HASH" > API_KEYS
          else
            cp API_KEYS.example API_KEYS
          fi

      - name: Assemble afat release
        run: ./gradlew assembleAfatRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ayuless-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
