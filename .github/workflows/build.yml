# SPDX-License-Identifier: GPL-3.0-or-later
name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/2* /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Runner image ships the Android SDK; android-actions/setup-android@v3 fails on the removed 'tools' package.
      - name: Install SDK and NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      # Replace the committed prebuilt .a files with ones built from the pinned
      # source submodules (cached by input hash). See Tools/native/.
      - name: Native libraries from source
        uses: ./.github/actions/native-prebuilts

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Write API_KEYS
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          if [ -n "$APP_ID" ]; then
            printf 'APP_ID=%s\nAPP_HASH=%s\n' "$APP_ID" "$APP_HASH" > API_KEYS
          else
            cp API_KEYS.example API_KEYS
          fi

      - name: Assemble afat release
        run: ./gradlew assembleAfatRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ayuless-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
