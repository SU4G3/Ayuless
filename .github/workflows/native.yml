# SPDX-License-Identifier: GPL-3.0-or-later
# Builds and validates all native static libraries from pinned sources.
name: Native libraries

on:
  workflow_dispatch:
  # Build already builds and validates these libraries for application changes.
  # Keep this entry point for inspecting native archives independently.

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuilts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/2* /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Install NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1"'

      - uses: ./.github/actions/native-prebuilts

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-prebuilts
          path: |
            TMessagesProj/jni/prebuild/lib
            TMessagesProj/jni/prebuild/include
          if-no-files-found: error
          retention-days: 7
