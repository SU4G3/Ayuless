# Builds and validates all native static libraries from pinned sources.
name: Native libraries

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'TMessagesProj/jni/prebuild/**'
      - 'TMessagesProj/jni/td'
      - 'TMessagesProj/jni/tlottie'
      - 'TMessagesProj/jni/wallet-engine'
      - 'TMessagesProj/jni/gram-wallet/**'
      - 'TMessagesProj/jni/third_party/boringssl'
      - 'TMessagesProj/jni/third_party/dav1d'
      - 'TMessagesProj/jni/third_party/ffmpeg'
      - 'TMessagesProj/jni/third_party/libvpx'
      - 'TMessagesProj/jni/third_party/openh264'
      - 'TMessagesProj/jni/third_party/wamr'
      - 'TMessagesProj/jni/third_party/xiph/opus'
      - 'TMessagesProj/jni/**/CMakeLists.txt'
      - 'TMessagesProj/jni/**/Android.mk'
      - '.gitmodules'
      - 'Tools/native/**'
      - '.github/actions/native-prebuilts/**'
      - '.github/workflows/native.yml'

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuilts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/2* /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: ./.github/actions/native-prebuilts

      - uses: actions/upload-artifact@v4
        with:
          name: native-prebuilts
          path: |
            TMessagesProj/jni/prebuild/lib
            TMessagesProj/jni/prebuild/include
          if-no-files-found: error
