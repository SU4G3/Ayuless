# SPDX-License-Identifier: GPL-3.0-or-later
name: Crowdin translations
on:
  workflow_dispatch:
    inputs:
      seed_existing_translations:
        description: Upload current repository translations on the first sync
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - TMessagesProj/src/main/res/values/ayuless.xml
      - crowdin.yml
      - Tools/localization/**
      - .github/workflows/crowdin.yml
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: crowdin-translations
  cancel-in-progress: false
jobs:
  synchronize:
    if: vars.CROWDIN_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check localization tooling
        run: |
          python3 Tools/localization/sync_translations.py
          python3 -m unittest discover -s Tools/localization -p 'test_*.py'
      - name: Check credentials
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          test -n "$CROWDIN_PROJECT_ID" || { echo 'Missing CROWDIN_PROJECT_ID'; exit 1; }
          test -n "$CROWDIN_PERSONAL_TOKEN" || { echo 'Missing CROWDIN_PERSONAL_TOKEN'; exit 1; }
      - name: Seed existing translations for first upload
        if: github.event_name == 'workflow_dispatch' && inputs.seed_existing_translations
        run: python3 Tools/localization/sync_translations.py --seed
      - name: Synchronize approved translations
        uses: crowdin/github-action@8f01d54f70f1713ee3f09d82c2bbb2daeac28689 # v2
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_existing_translations }}
          auto_approve_imported: false
          download_translations: true
          skip_untranslated_strings: true
          export_only_approved: true
          push_translations: false
          create_pull_request: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
      - name: Validate and merge downloads without dropping existing translations
        run: python3 Tools/localization/sync_translations.py --merge
      - name: Open a translation pull request
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          branch: l10n/crowdin
          base: main
          title: Update Ayuless translations
          commit-message: Update Ayuless translations
          body: |
            Approved Crowdin translations. XML and format placeholders were checked before opening this PR. Missing translations retain the existing entry or English fallback.

            <!-- ayuless-agent -->
          add-paths: TMessagesProj/src/main/res/values-*/ayuless.xml
          labels: translations
      # PRs created with GITHUB_TOKEN do not emit ordinary pull_request workflows.
      - name: Validate the translation pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref l10n/crowdin
