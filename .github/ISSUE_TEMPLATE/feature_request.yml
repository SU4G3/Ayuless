name: Feature request
description: Suggest a new feature
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: This does not require proprietary dependencies or Google services.
          required: true
