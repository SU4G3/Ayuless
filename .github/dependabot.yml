version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, build]

  # Gradle: security updates only. Version bumps come from upstream rebases.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies, build]
