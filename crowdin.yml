project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
preserve_hierarchy: true
files:
  - source: /TMessagesProj/src/main/res/values/ayuless.xml
    translation: /.crowdin/translations/values-%android_code%/ayuless.xml
    type: android
    # Match the existing language-wide Android resource directories.
    languages_mapping:
      android_code:
        ar: ar
        de: de
        es-ES: es
        it: it
        ko: ko
        nl: nl
        ru: ru
        uk: uk
